<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LingoWorld</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:white;text-align:center;background:linear-gradient(135deg,#5146e5,#a52be2,#e33da8);min-height:100vh}
header{padding:20px;font-size:25px;font-weight:bold}
main{max-width:650px;margin:auto;padding:15px}
h2{font-size:34px}
.languages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.card{background:white;color:#171717;border:0;border-radius:22px;padding:25px 8px;font-size:20px;font-weight:bold;cursor:pointer;min-height:125px}
.flag{display:block;font-size:38px;margin-bottom:10px}
.word{background:#ffffff25;border-radius:25px;padding:20px;margin-top:28px}
.back,.action{border:0;border-radius:12px;padding:12px 22px;margin:8px;font-size:17px;cursor:pointer}
.back{background:white;color:#5b21b6}
.action{background:#ffe36e;color:#30204c;font-weight:bold}
.lesson{background:#ffffff20;border-radius:18px;padding:15px;margin:12px 0}
.lesson button{background:white;color:#222;border:0;border-radius:10px;padding:10px;margin:5px;cursor:pointer}
#result{font-size:20px;font-weight:bold;margin:15px}
</style>
</head>
<body>
<header>🌍 LingoWorld</header>
<main id="app">
<h2>تعلم أي لغة<br>في أي مكان</h2>
<p>تعلم اللغات بطريقة سهلة وممتعة</p>
<div class="languages">
<button class="card" onclick="openLanguage('en')"><span class="flag">🇬🇧</span>English</button>
<button class="card" onclick="openLanguage('es')"><span class="flag">🇪🇸</span>Spanish</button>
<button class="card" onclick="openLanguage('fr')"><span class="flag">🇫🇷</span>French</button>
<button class="card" onclick="openLanguage('tr')"><span class="flag">🇹🇷</span>Turkish</button>
</div>
<div class="word"><h2>كلمة اليوم</h2><p style="font-size:30px;font-weight:bold">Hello - مرحباً</p></div>
</main>
<script>
const data={
en:{name:"الإنجليزية",voice:"en-GB",lessons:[
{title:"التحيات",words:[["Hello","مرحباً"],["Good morning","صباح الخير"],["Goodbye","إلى اللقاء"]]},
{title:"التعارف",words:[["My name is Ali","اسمي علي"],["How are you?","كيف حالك؟"],["Thank you","شكراً"]]}
]},
es:{name:"الإسبانية",voice:"es-ES",lessons:[
{title:"التحيات",words:[["Hola","مرحباً"],["Buenos días","صباح الخير"],["Adiós","إلى اللقاء"]]},
{title:"كلمات أساسية",words:[["Gracias","شكراً"],["Por favor","من فضلك"],["Sí","نعم"]]}
]},
fr:{name:"الفرنسية",voice:"fr-FR",lessons:[
{title:"التحيات",words:[["Bonjour","مرحباً"],["Bonsoir","مساء الخير"],["Au revoir","إلى اللقاء"]]},
{title:"كلمات أساسية",words:[["Merci","شكراً"],["S'il vous plaît","من فضلك"],["Oui","نعم"]]}
]},
tr:{name:"التركية",voice:"tr-TR",lessons:[
{title:"التحيات",words:[["Merhaba","مرحباً"],["Günaydın","صباح الخير"],["Hoşça kal","إلى اللقاء"]]},
{title:"كلمات أساسية",words:[["Teşekkürler","شكراً"],["Lütfen","من فضلك"],["Evet","نعم"]]}
]}
};
function openLanguage(code){
const lang=data[code];
let html='<button class="back" onclick="home()">← الرئيسية</button>';
html+='<h2>تعلم '+lang.name+'</h2><p>اختاري كلمة لتسمعي نطقها، أو ابدئي الاختبار.</p>';
lang.lessons.forEach((lesson,i)=>{
html+='<section class="lesson"><h3>'+lesson.title+'</h3>';
lesson.words.forEach(w=>{
html+='<p style="font-size:21px"><b>'+w[0]+'</b> — '+w[1]+'</p>';
html+='<button onclick="speakWord(\''+code+'\',\''+w[0].replace(/'/g,"\\'")+'\')">🔊 اسمع النطق</button>';
});
html+='<button class="action" onclick="quiz(\''+code+'\','+i+')">ابدأ الاختبار</button></section>';
});
document.getElementById('app').innerHTML=html;
window.scrollTo(0,0);
}
function speakWord(code,word){
if(!('speechSynthesis' in window)){alert('النطق الصوتي غير مدعوم في هذا المتصفح');return;}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(word);
u.lang=data[code].voice;
speechSynthesis.speak(u);
}
function quiz(code,index){
const words=data[code].lessons[index].words;
let html='<button class="back" onclick="openLanguage(\''+code+'\')">← رجوع للدروس</button>';
html+='<h2>اختبار '+data[code].name+'</h2><p>اختاري الترجمة الصحيحة</p>';
words.forEach((w,i)=>{
let options=[w[1],words[(i+1)%words.length][1],words[(i+2)%words.length][1]];
options.sort(()=>Math.random()-.5);
html+='<div class="lesson"><p><b>'+w[0]+'</b></p>';
options.forEach(opt=>{
html+='<button onclick="checkAnswer(this,\''+encodeURIComponent(opt)+'\',\''+encodeURIComponent(w[1])+'\')">'+opt+'</button>';
});
html+='</div>';
});
html+='<div id="result"></div>';
document.getElementById('app').innerHTML=html;
window.scrollTo(0,0);
}
function checkAnswer(btn,chosen,correct){
const box=btn.parentElement;
if(box.dataset.done)return;
box.dataset.done='1';
const isCorrect=chosen===correct;
btn.style.background=isCorrect?'#a7f3d0':'#fecaca';
box.querySelectorAll('button').forEach(b=>b.disabled=true);
const msg=document.createElement('p');
msg.textContent=isCorrect?'إجابة صحيحة! أحسنت 🎉':'الإجابة الصحيحة: '+decodeURIComponent(correct);
box.appendChild(msg);
}
function home(){
document.getElementById('app').innerHTML=`
<h2>تعلم أي لغة<br>في أي مكان</h2>
<p>تعلم اللغات بطريقة سهلة وممتعة</p>
<div class="languages">
<button class="card" onclick="openLanguage('en')"><span class="flag">🇬🇧</span>English</button>
<button class="card" onclick="openLanguage('es')"><span class="flag">🇪🇸</span>Spanish</button>
<button class="card" onclick="openLanguage('fr')"><span class="flag">🇫🇷</span>French</button>
<button class="card" onclick="openLanguage('tr')"><span class="flag">🇹🇷</span>Turkish</button>
</div>
<div class="word"><h2>كلمة اليوم</h2><p style="font-size:30px;font-weight:bold">Hello - مرحباً</p></div>`;
window.scrollTo(0,0);
}
</script>
</body>
</html>
